name: Diagnose native macOS TLS fixtures

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tls:
    name: TLS diagnostics ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - name: Record TLS runtime and loopback resolution
        run: |
          node -p 'JSON.stringify({versions:process.versions,autoSelectFamily:require("node:net").getDefaultAutoSelectFamily(),nodeOptions:process.env.NODE_OPTIONS,opensslConf:process.env.OPENSSL_CONF})'
          node -e 'require("node:dns").lookup("localhost",{all:true},(error,addresses)=>console.log({error,addresses}))'
          command -v openssl
          openssl version
      - run: npm ci --no-audit
      - run: npm run build
      - name: Run TLS fixtures and strict certificate controls
        run: node --test test/mqtt-tls.test.cjs
